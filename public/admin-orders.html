<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAFA — Customer Orders</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#18263a;font-family:Arial,sans-serif}main{max-width:1200px;margin:0 auto;padding:40px 20px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{letter-spacing:.18em;font-size:11px;color:#8a6a3a}.panel{background:#fff;border:1px solid #e5dfd5;border-radius:14px;padding:22px;box-shadow:0 8px 30px #18263a0b}.login{max-width:430px;margin:12vh auto}.h{font-family:Georgia,serif;font-size:42px;margin:8px 0 24px}label{display:block;font-size:13px;margin:14px 0}input,select{width:100%;padding:13px;border:1px solid #d9d2c8;background:#fff;border-radius:8px;margin-top:7px}button{border:0;border-radius:8px;padding:12px 16px;background:#18263a;color:#fff;cursor:pointer}.gold{background:#8a6a3a}.error{color:#8b2635;margin-top:12px}.hidden{display:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input{max-width:320px;margin:0}.table{overflow:auto}.row{display:grid;grid-template-columns:130px 1.2fr 130px 130px 170px;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #eee7dc;min-width:760px}.head{font-size:11px;letter-spacing:.1em;color:#6b6b6b}.customer b,.customer small{display:block}.customer small{margin-top:5px;color:#6b6b6b}.status{padding:8px;border:1px solid #ddd5ca;background:#faf9f6;border-radius:7px}.empty{text-align:center;padding:50px;color:#6b6b6b}.detail{margin-top:18px;display:none}.detail pre{white-space:pre-wrap;font-family:Arial,sans-serif;line-height:1.7}.count{font-size:13px;color:#6b6b6b}@media(max-width:700px){main{padding:22px 14px}.top{align-items:start;flex-direction:column}.h{font-size:34px}.panel{padding:16px}}
</style></head><body><main><section id="login" class="panel login"><div class="eyebrow">SAFA / MANAGEMENT</div><h1 class="h">Customer orders.</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="gold" type="submit">ENTER ORDERS ↗</button><div id="loginError" class="error"></div></form></section><section id="app" class="hidden"><div class="top"><div><div class="eyebrow">SAFA / ORDERS</div><h1 class="h">Customer orders.</h1><div id="count" class="count"></div></div><button id="refresh">REFRESH ↻</button></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search order, name or phone..."><select id="filter"><option value="">All statuses</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select><button id="logout">LOG OUT</button></div><div class="table"><div class="row head"><div>ORDER</div><div>CUSTOMER</div><div>TOTAL</div><div>DATE</div><div>STATUS</div></div><div id="rows"></div></div><div id="detail" class="detail panel"></div></div></section></main><script>let token=localStorage.getItem('safaAdminToken')||'',orders=[];const $=id=>document.getElementById(id);function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{orders=await api('/api/admin/orders');render()}catch(e){if(e.message.includes('Authentication')){token='';localStorage.removeItem('safaAdminToken');$('app').classList.add('hidden');$('login').classList.remove('hidden')}else alert(e.message)}}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=orders.filter(o=>(!f||o.status===f)&&(!q||[o.order_number,o.customer_name,o.phone1,o.phone2].join(' ').toLowerCase().includes(q)));$('count').textContent=list.length+' order'+(list.length===1?'':'s');$('rows').innerHTML=list.length?list.map(o=>`<div class="row"><div><b>${o.order_number}</b></div><div class="customer"><b>${esc(o.customer_name)}</b><small>${esc(o.phone1)} · ${esc(o.governorate)}</small></div><div>${Number(o.total).toLocaleString()} EGP</div><div>${new Date(o.created_at).toLocaleString()}</div><div><select class="status" data-id="${o.id}">${['new','confirmed','preparing','shipped','delivered','cancelled'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`).join(''):'<div class="empty">No customer orders found.</div>';document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{try{await api('/api/admin/orders/'+s.dataset.id,{method:'PATCH',body:JSON.stringify({status:s.value})});await load()}catch(e){alert(e.message);load()}});document.querySelectorAll('.row:not(.head)').forEach((r,i)=>r.onclick=()=>detail(list[i]))}function detail(o){$('detail').style.display='block';$('detail').innerHTML=`<b>${o.order_number}</b><h3>${esc(o.customer_name)}</h3><pre>Phone 1: ${esc(o.phone1)}\nPhone 2: ${esc(o.phone2)}\nGovernorate: ${esc(o.governorate)}\nAddress: ${esc(o.address)}\nTotal: ${Number(o.total).toLocaleString()} EGP\nStatus: ${o.status}\nCreated: ${new Date(o.created_at).toLocaleString()}</pre>`}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.token;localStorage.setItem('safaAdminToken',token);showApp()}catch(e){$('loginError').textContent=e.message}};$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;$('logout').onclick=()=>{token='';localStorage.removeItem('safaAdminToken');location.reload()};if(token)showApp();</script></body></html>
