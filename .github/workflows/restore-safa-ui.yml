name: Restore SAFA UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !startsWith(github.event.head_commit.message, 'Restore SAFA UI') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore removed UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.jsx')
          s=p.read_text()
          if "import'./mobile.css';" not in s:
              s=s.replace("import'./style.css';", "import'./style.css';\nimport'./mobile.css';")

          old_footer=re.search(r'function Footer\(\)\{.*?\}', s, re.S)
          new_footer='''function Footer(){return <footer><div className="brand">Safa &amp; More<span>صفا</span></div><p>Beauty, refined.</p><div className="socials"><a href="https://www.instagram.com/safa_beauty0?igsi=MXN3czQ5bHB2dHF1ZA==" target="_blank" rel="noreferrer">Instagram ↗</a><a href="https://www.facebook.com/share/1MQzfEhrYw/" target="_blank" rel="noreferrer">Facebook ↗</a><a href="https://wa.me/201044665050" target="_blank" rel="noreferrer">WhatsApp 01044665050 ↗</a><a href="https://www.tiktok.com/@safamore?_r=1&amp;_t=ZS-99TjSPCOR9D" target="_blank" rel="noreferrer">TikTok ↗</a></div><small className="credit">Designed &amp; Developed by <strong>Amr Abdelhay</strong></small></footer>}'''
          if old_footer:
              s=s[:old_footer.start()]+new_footer+s[old_footer.end():]

          # Restore the richer product form removed by the mobile commit.
          start=s.find('function AddProductModal(')
          end=s.find('\nfunction ProductModal(', start)
          if start>=0 and end>=0:
              add='''function AddProductModal({categories,close,saved}){const[form,setForm]=useState({nameEn:'',nameAr:'',descriptionEn:'',descriptionAr:'',price:'',stock:'0',categoryId:'',discountType:'none',discountValue:'',offerEnabled:false,offerTitleEn:'',offerTitleAr:'',offerType:'percentage',offerValue:'',featured:false,newArrival:false}),[image,setImage]=useState(null),[saving,setSaving]=useState(false),[error,setError]=useState('');const change=(k,v)=>setForm(f=>({...f,[k]:v}));const submit=async e=>{e.preventDefault();setSaving(true);setError('');try{const r=await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nameEn:form.nameEn,nameAr:form.nameAr,descriptionEn:form.descriptionEn,descriptionAr:form.descriptionAr,price:Number(form.price),stock:Number(form.stock),categoryId:form.categoryId||null,discountType:form.discountType,discountValue:Number(form.discountValue||0),featured:form.featured,newArrival:form.newArrival,active:true,tags:[]})});const product=await r.json().catch(()=>({}));if(!r.ok)throw Error(product.error||'Product could not be created');if(image){const fd=new FormData();fd.append('file',image);const ir=await api(`/api/admin/products/${product.id}/images`,{method:'POST',body:fd});if(!ir.ok){const ix=await ir.json().catch(()=>({}));throw Error(ix.error||'Product was created but image upload failed')}}if(form.offerEnabled){const or=await api('/api/admin/offers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({titleEn:form.offerTitleEn||`${form.nameEn} Offer`,titleAr:form.offerTitleAr||`${form.nameAr} Offer`,type:form.offerType,value:Number(form.offerValue||0),productIds:[product.id]})});if(!or.ok){const ox=await or.json().catch(()=>({}));throw Error(ox.error||'Product created, but offer could not be created')}}saved()}catch(e){setError(e.message)}finally{setSaving(false)}};return <div className="modal"><div className="productform productform-large"><button className="close" type="button" onClick={close}>×</button><p className="eyebrow">PRODUCT MANAGEMENT</p><h2>Add product</h2><form onSubmit={submit}><label>Product image<input type="file" accept="image/*" onChange={e=>setImage(e.target.files?.[0]||null)}/></label><div className="formgrid"><label>Product name (English)<input required value={form.nameEn} onChange={e=>change('nameEn',e.target.value)}/></label><label>Product name (Arabic)<input required value={form.nameAr} onChange={e=>change('nameAr',e.target.value)}/></label></div><label>Description (English)<textarea value={form.descriptionEn} onChange={e=>change('descriptionEn',e.target.value)}/></label><label>Description (Arabic)<textarea value={form.descriptionAr} onChange={e=>change('descriptionAr',e.target.value)}/></label><div className="formgrid"><label>Price (EGP)<input required min="0" step="0.01" type="number" value={form.price} onChange={e=>change('price',e.target.value)}/></label><label>Stock quantity<input min="0" step="1" type="number" value={form.stock} onChange={e=>change('stock',e.target.value)}/></label></div><label>Category<select value={form.categoryId} onChange={e=>change('categoryId',e.target.value)}><option value="">Uncategorized</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name_en} / {c.name_ar}</option>)}</select></label><div className="discount-box"><h3>Discount</h3><div className="formgrid"><label>Discount type<select value={form.discountType} onChange={e=>change('discountType',e.target.value)}><option value="none">No discount</option><option value="percent">Percentage %</option><option value="fixed">Fixed EGP</option></select></label><label>Discount value<input min="0" step="0.01" type="number" value={form.discountValue} disabled={form.discountType==='none'} onChange={e=>change('discountValue',e.target.value)}/></label></div></div><div className="discount-box"><label className="checkline"><input type="checkbox" checked={form.offerEnabled} onChange={e=>change('offerEnabled',e.target.checked)}/> Add an offer for this product</label>{form.offerEnabled&&<><div className="formgrid"><label>Offer title (English)<input value={form.offerTitleEn} onChange={e=>change('offerTitleEn',e.target.value)}/></label><label>Offer title (Arabic)<input value={form.offerTitleAr} onChange={e=>change('offerTitleAr',e.target.value)}/></label></div><div className="formgrid"><label>Offer type<select value={form.offerType} onChange={e=>change('offerType',e.target.value)}><option value="percentage">Percentage</option><option value="fixed">Fixed amount</option><option value="bundle">Bundle</option><option value="buy_x_get_y">Buy X Get Y</option></select></label><label>Offer value<input min="0" step="0.01" type="number" value={form.offerValue} onChange={e=>change('offerValue',e.target.value)}/></label></div></>}</div><div className="formgrid"><label className="checkline"><input type="checkbox" checked={form.featured} onChange={e=>change('featured',e.target.checked)}/> Featured product</label><label className="checkline"><input type="checkbox" checked={form.newArrival} onChange={e=>change('newArrival',e.target.checked)}/> New arrival</label></div>{error&&<p className="error">{error}</p>}<button className="goldbtn" disabled={saving}>{saving?'SAVING…':'SAVE PRODUCT ↗'}</button></form></div></div>}'''
              s=s[:start]+add+s[end:]

          # Restore richer product modal.
          start=s.find('function ProductModal(')
          end=s.find('\nfunction Storage(', start)
          if start>=0 and end>=0:
              modal='''function ProductModal({p,add,close}){return <div className="modal" onClick={close}><div className="modalbox" onClick={e=>e.stopPropagation()}><button className="close" onClick={close}>×</button><div className="modalimg">{p.images?.[0]?.url?<img src={p.images[0].url} alt={p.name_en}/>:<span>✦</span>}</div><p className="eyebrow">{p.category_en}</p><h2>{p.name_en}</h2><p>{p.description_en}</p><strong>{money(p.final_price??p.price)} EGP</strong><button className="goldbtn" onClick={()=>{add(p);close()}}>ADD TO BAG</button></div></div>}'''
              s=s[:start]+modal+s[end:]

          # Restore richer storage.
          start=s.find('function Storage(')
          end=s.find('\nfunction Orders(', start)
          if start>=0 and end>=0:
              storage='''function Storage(){const[products,setProducts]=useState([]);useEffect(()=>{api('/api/admin/products').then(r=>r.ok?r.json():[]).then(setProducts).catch(()=>{})},[]);const total=products.reduce((a,p)=>a+Number(p.stock||0),0);return <section className="storage"><p className="eyebrow">SAFA / INVENTORY</p><h1>Storage</h1><p className="muted">Inventory movement and current stock.</p><div className="storagecards"><div><small>TOTAL UNITS</small><b>{total}</b></div><div><small>PRODUCTS</small><b>{products.length}</b></div><div><small>LOW STOCK</small><b>{products.filter(p=>Number(p.stock)<5).length}</b></div></div><div className="panel stocktable"><h2>Inventory</h2><div className="tablehead"><span>PRODUCT</span><span>CATEGORY</span><span>STOCK</span><span>PRICE</span></div>{products.map(p=><div className="tablerow" key={p.id}><span><b>{p.name_en}</b><small>{p.name_ar}</small></span><span>{p.category_en||'—'}</span><span className={Number(p.stock)<5?'low':''}>{p.stock}</span><span>{money(p.final_price??p.price)} EGP</span></div>)}</div></section>}'''
              s=s[:start]+storage+s[end:]

          # Restore richer orders.
          start=s.find('function Orders(')
          end=s.find('\nfunction Footer(', start)
          if start>=0 and end>=0:
              orders='''function Orders(){const[orders,setOrders]=useState([]);const load=()=>api('/api/admin/orders').then(r=>r.ok?r.json():[]).then(setOrders).catch(()=>{});useEffect(load,[]);const update=async(id,status)=>{await api(`/api/admin/orders/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()};return <section className="adminview"><div className="orderhead"><div><p className="eyebrow">SAFA / SALES</p><h1>Orders</h1></div></div><div className="panel">{orders.length?orders.map(o=><div className="order-row" key={o.id}><div><b>#{o.order_number}</b><small>{o.customer_name} · {o.phone1}</small><small>{o.address}</small></div><strong>{money(o.total)} EGP</strong><select value={o.status} onChange={e=>update(o.id,e.target.value)}><option>new</option><option>confirmed</option><option>preparing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></div>):<p className="muted">No orders yet.</p>}</div></section>}'''
              s=s[:start]+orders+s[end:]

          # Make the homepage curated categories explicit and restore the seven labels.
          s=s.replace("function Home({products,categories,offers,add,open,go,t}){return <>", "function Home({products,categories,offers,add,open,go,t}){const curated=[{name_en:'CLINIQUE'},{name_en:'Curology'},{name_en:'Skincare'},{name_en:'Face Care'},{name_en:'Hair Care'},{name_en:'Body Care'},{name_en:'Lip Care'}];const cats=[...curated,...categories.filter(c=>!curated.some(x=>x.name_en.toLowerCase()===String(c.name_en||'').toLowerCase()))].slice(0,7);return <>")
          s=s.replace("categories.slice(0,5).map((c,i)", "cats.map((c,i)")
          s=s.replace("<span>0{i+1}</span>", "<span>{String(i+1).padStart(2,'0')}</span>")

          # Code-only admin UX. Email remains an internal server lookup value and is never shown.
          start=s.find('function AdminLogin(')
          end=s.find('\nfunction Dashboard(', start)
          if start>=0 and end>=0:
              login='''function AdminLogin({onLogin}){const[email]=useState('admin@safa.local'),[password,setPassword]=useState(''),[error,setError]=useState('');return <main className="admin loginadmin"><div className="productform"><p className="eyebrow">SAFA / MANAGEMENT</p><h1>Admin access</h1><form onSubmit={async e=>{e.preventDefault();const r=await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const x=await r.json().catch(()=>({}));if(!r.ok)return setError(x.error||'Invalid access code');onLogin(x.token)}}><label className="access-code-label">Access code<input autoFocus value={password} onChange={e=>setPassword(e.target.value)} type="password" placeholder="Enter access code" required/></label>{error&&<p className="error">{error}</p>}<button className="goldbtn">ENTER ↗</button></form></div></main>}'''
              s=s[:start]+login+s[end:]

          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit restored UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "Restore SAFA UI" || exit 0
          git push origin main
