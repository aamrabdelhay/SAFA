name: Apply final SAFA catalog UX
on:
  push:
    branches: [main]
    paths: ['scripts/apply-catalog-final3.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply catalog UX
        run: python3 scripts/apply-catalog-final3.py
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/style.css server/index.js server/schema.sql
          git diff --cached --quiet && exit 0
          git commit -m 'Improve categories, product options and cart UX'
          git push origin main
