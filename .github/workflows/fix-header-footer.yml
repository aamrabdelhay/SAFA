name: Improve header and footer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-header-footer.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          jsx = Path('src/main.jsx')
          s = jsx.read_text()
          m = re.search(r'function Footer\([^)]*\)\{(.*?)(?=\nfunction |\nconst |\ncreateRoot)', s, re.S)
          if not m:
              raise SystemExit('Footer component not found')
          footer = m.group(1)
          original = footer
          footer = footer.replace('Beauty,<br/><i>refined.</i>', '')
          footer = footer.replace('Beauty, refined.', '')
          footer = footer.replace('Instagram ↗', '📷 Instagram ↗') if '📷 Instagram ↗' not in footer else footer
          footer = footer.replace('Facebook ↗', 'ⓕ Facebook ↗') if 'ⓕ Facebook ↗' not in footer else footer
          footer = footer.replace('WhatsApp 01044665050 ↗', '💬 WhatsApp 01044665050 ↗') if '💬 WhatsApp' not in footer else footer
          footer = footer.replace('TikTok ↗', '🎵 TikTok ↗') if '🎵 TikTok ↗' not in footer else footer
          if footer == original:
              print('Footer text already clean; continuing with header CSS')
          s = s[:m.start(1)] + footer + s[m.end(1):]
          jsx.write_text(s)
          PY
          cat >> src/style.css <<'CSS'

/* Refined desktop header typography */
.header nav {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .4px;
  text-transform: none;
  gap: 6px;
}
.header nav a { padding: 10px 14px; }
@media (max-width:700px) {
  .header nav { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 13px; letter-spacing: .2px; }
  .header nav a { font-size: 13px; padding: 9px 11px; }
}
CSS
      - name: Build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/style.css
          git diff --cached --quiet && exit 0
          git commit -m 'Refine header typography and footer socials'
          git push origin main
