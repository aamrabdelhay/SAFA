name: Apply SAFA visual refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer and header design
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          old="""const curated=[{name:'CLINIQUE',fallback:'https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=900&q=85'},{name:'Curology',fallback:'https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?auto=format&fit=crop&w=900&q=85'},{name:'Skincare',fallback:'https://images.unsplash.com/photo-1556229010-9f7e3f2f9d5a?auto=format&fit=crop&w=900&q=85'},{name:'Face Care',fallback:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=900&q=85'},{name:'Hair Care',fallback:'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=900&q=85'},{name:'Body Care',fallback:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=900&q=85'},{name:'Lip Care',fallback:'https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=900&q=85'}];"""
          new="""const curated=[{name:'Skincare',fallback:'https://images.unsplash.com/photo-1556229010-9f7e3f2f9d5a?auto=format&fit=crop&w=900&q=85'},{name:'Face Care',fallback:'https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=900&q=85'},{name:'Hair Care',fallback:'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=900&q=85'},{name:'Body Care',fallback:'https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=900&q=85'},{name:'Lip Care',fallback:'https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=900&q=85'}];"""
          if old not in s: raise SystemExit('curated block not found')
          s=s.replace(old,new,1)
          old_footer=s[s.index('function Footer()'):s.index("\n\ncreateRoot",s.index('function Footer()'))]
          new_footer="""function Footer(){return <footer><div className=\"footer-brand\"><div className=\"brand\">Safa &amp; More<span></span></div></div><div className=\"socials\"><a href=\"https://www.instagram.com/safa_beauty0?igsi=MXN3czQ5bHB2dHF1ZA==\" target=\"_blank\" rel=\"noreferrer\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><circle cx=\"17.5\" cy=\"6.5\" r=\"1\"/></svg> Instagram ↗</a><a href=\"https://www.facebook.com/share/1MQzfEhrYw/\" target=\"_blank\" rel=\"noreferrer\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 8h3V4h-3c-3.3 0-5 1.8-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1Z\"/></svg> Facebook ↗</a><a href=\"https://wa.me/201044665050\" target=\"_blank\" rel=\"noreferrer\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 4.1A10 10 0 0 0 4.3 16.2L3 21l4.9-1.3A10 10 0 1 0 20 4.1Z\"/><path d=\"M8 8.5c.3-.5.6-.5 1-.5l1 2c.1.3.1.5-.1.8l-.5.6c.7 1.2 1.5 1.9 2.8 2.5l.5-.6c.2-.3.5-.3.8-.2l2 1c.3.2.3.5.2.8-.3 1-1 1.5-1.8 1.5-3.3 0-1-3.9-3-4.8-4.3-.7-1-.9-2.5-.1-3.6Z\"/></svg> WhatsApp 01044665050 ↗</a><a href=\"https://www.tiktok.com/@safamore?_r=1&amp;_t=ZS-99TjSPCOR9D\" target=\"_blank\" rel=\"noreferrer\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 4v10.2a3.8 3.8 0 1 1-3-3.7V7.3A7 7 0 1 0 17 14V9.2c1.5 1 3.2 1.5 5 1.5V7.2c-2.7 0-5-1.4-6-3.2H14Z\"/></svg> TikTok ↗</a></div><small className=\"credit\">Designed &amp; Developed by <strong>Amr Abdelhay</strong></small></footer>}"""
          s=s.replace(old_footer,new_footer,1)
          p.write_text(s)

          css=Path('src/style.css')
          c=css.read_text()
          c += """
/* SAFA luxury visual refresh */
.header .actions{gap:12px}
.header .actions button{border:0!important;border-radius:50%;width:42px;height:42px;padding:0;display:grid;place-items:center;background:#fffdf8;color:#6f5730;box-shadow:0 4px 14px #211f1b12;transition:all .2s}
.header .actions button:hover{background:#f0d98c;border-color:transparent;transform:scale(1.04)}
.header .actions .bag{border-radius:22px;width:auto;padding:0 17px;display:block;box-shadow:0 4px 14px #211f1b12}
.header .actions .keybutton{font-size:18px}
.footer-brand{display:flex;align-items:center}
.footer-brand .brand{font-size:27px}
.socials a{display:flex;align-items:center;gap:9px;min-width:190px}
.socials svg{fill:none;stroke:#b8860b;stroke-width:1.6px;width:17px;height:17px}
.socials a:nth-child(2) svg{fill:#b8860b;stroke:none}
.socials a:nth-child(3) svg{width:18px;height:18px}
.socials a:hover{color:#b8860b}
.category-photo-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.category-photo-grid .cat{height:260px;padding:18px}
.category-photo-grid .cat h3{font-size:25px}
@media(max-width:700px){.header .actions{gap:5px}.header .actions button{width:34px;height:34px}.header .actions .bag{width:auto;padding:0 10px}.category-photo-grid{display:flex;overflow:auto}.category-photo-grid .cat{min-width:175px;height:235px}}
"""
          css.write_text(c)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/style.css
          git diff --cached --quiet && exit 0
          git commit -m "style: restore luxury SAFA header and footer"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-safa-visual-refresh.yml
          git commit -m "chore: remove temporary visual refresh workflow"
          git push
