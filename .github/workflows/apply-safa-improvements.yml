name: Apply SAFA improvements

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/main.jsx'
      - 'src/mobile.css'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-safa-improvements.py
      - name: Verify build
        id: build
        continue-on-error: true
        run: |
          npm ci
          npm run build > build-error.txt 2>&1
          code=$?
          cat build-error.txt
          exit $code
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safa-build-diagnostic
          path: build-error.txt
      - name: Commit changes
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/mobile.css
          git commit -m "SAFA improvements applied" || exit 0
          git push origin main
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
