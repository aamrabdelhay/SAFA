name: Apply SAFA improvements

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/main.jsx'
      - 'src/mobile.css'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-safa-improvements.py
      - name: Verify build
        run: |
          npm ci
          set +e
          npm run build > build-error.txt 2>&1
          code=$?
          cat build-error.txt
          if [ $code -ne 0 ]; then exit $code; fi
      - name: Commit changes
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/mobile.css
          git commit -m "SAFA improvements applied" || exit 0
          git push origin main
      - name: Save build diagnostic
        if: ${{ failure() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- src/main.jsx src/mobile.css || true
          git add build-error.txt
          git commit -m "SAFA build diagnostic" || exit 0
          git push origin main || true
