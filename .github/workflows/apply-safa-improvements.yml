name: Apply SAFA improvements

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/main.jsx'
      - 'src/mobile.css'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-safa-improvements.py
      - name: Verify build
        id: build
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund > build-error.txt 2>&1
          for i in 1 2 3; do
            npm run build >> build-error.txt 2>&1 && exit 0
            echo "Build attempt $i failed; retrying..." >> build-error.txt
            sleep 3
          done
          exit 1
      - name: Commit changes
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/mobile.css
          git commit -m "SAFA improvements applied" || exit 0
          git push origin main
      - name: Save diagnostic branch
        if: steps.build.outcome != 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-safa
          git add build-error.txt src/main.jsx
          git commit -m "SAFA build diagnostic" || true
          git push origin debug-safa --force
          exit 1
