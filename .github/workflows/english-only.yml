name: Make SAFA English Only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  english-only:
    if: ${{ !contains(github.event.head_commit.message, 'English-only applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove Arabic UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.jsx')
          s=p.read_text()
          s=s.replace("[page,setPage]=useState('home'),[cart,setCart]=useState([]),[lang,setLang]=useState('EN'),[search,setSearch]=useState(''),", "[page,setPage]=useState('home'),[cart,setCart]=useState([]),[search,setSearch]=useState(''),")
          s=s.replace(" const ar=lang==='AR';\n", "")
          s=re.sub(r"\n const t=ar\?.*?;", "\n const t={products:'Products',categories:'Categories',offers:'Offers',cart:'Bag',shop:'SHOP COLLECTION'};", s, count=1)
          s=s.replace("<div dir={ar?'rtl':'ltr'}>", "<div>")
          s=s.replace("<button onClick={()=>setLang(ar?'EN':'AR')}>{ar?'EN':'AR'}</button>", "")
          s=s.replace('alt="SAFA صفا"','alt="SAFA"').replace('<b>Safa &amp; More</b><span>صفا</span>','<b>Safa &amp; More</b>')
          s=s.replace("`${p.name_en} ${p.name_ar} ${p.description_en} ${p.category_en||''}`","`${p.name_en} ${p.description_en} ${p.category_en||''}`")
          s=re.sub(r"<label>Product name \(Arabic\)<input required value=\{form\.nameAr\} onChange=\{e=>change\('nameAr',e\.target\.value\)\}/></label>", "", s)
          s=re.sub(r"<label>Description \(Arabic\)<textarea value=\{form\.descriptionAr\} onChange=\{e=>change\('descriptionAr',e\.target\.value\)\}/></label>", "", s)
          s=s.replace('<small>{p.name_ar}</small>','')
          s=s.replace('nameAr:form.nameAr,','nameAr:form.nameEn,').replace('descriptionAr:form.descriptionAr,','descriptionAr:form.descriptionEn,')
          s=re.sub(r'صفا','',s)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit English-only UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "English-only applied" || exit 0
          git push origin main