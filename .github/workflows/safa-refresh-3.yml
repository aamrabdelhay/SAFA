name: SAFA refresh 3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual changes
        run: |
          python3 - <<'PY'
          import base64
          exec(base64.b64decode('c2NyaXB0'))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/style.css
          git diff --cached --quiet || git commit -m 'style: restore luxury SAFA header and footer'
          git push
