<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="SAFA & More — thoughtful beauty formulas and quiet luxury for your daily ritual." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/category-photo-fix.css" />
    <link rel="stylesheet" href="/admin-key-footer-fix.css" />
    <link rel="stylesheet" href="/category-page-images.css" />
    <link rel="stylesheet" href="/admin-category-image-editor.css" />
    <link rel="stylesheet" href="/admin-archive.css" />
    <link rel="stylesheet" href="/site-fixes.css?v=7" />
    <link rel="stylesheet" href="/site-enhancements.css?v=4" />
    <link rel="stylesheet" href="/safa-home-logo.css?v=8" />
    <link rel="stylesheet" href="/product-page.css?v=2" />
    <title>SAFA & More — Luxury Beauty</title>
    <style>
      .header-search input{display:none!important}
      .header-search{display:flex!important;align-items:center;justify-content:center;width:26px;height:34px}
      .header-search span{font-size:22px;line-height:1;display:block}
      .hero-copy{text-align:center!important;margin-left:auto!important;margin-right:auto!important}
      .hero-copy::before{display:none!important;content:none!important}
      .footer .brand,.footer-brand .brand{background:linear-gradient(90deg,#B69665,#D2B274);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#B69665}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/clean-app.jsx"></script>
    <script src="/homepage-logo.js?v=1"></script>
    <script src="/admin-key-footer-fix.js"></script>
    <script src="/category-page-images.js?v=2"></script>
    <script src="/admin-category-image-editor.js?v=1"></script>
    <script src="/admin-archive.js?v=1"></script>
    <script src="/site-fixes.js?v=6"></script>
    <script src="/site-enhancements.js?v=3"></script>
    <script src="/order-details.js?v=1"></script>
    <script src="/product-page.js?v=3"></script>
    <script>
      document.addEventListener('click',function(e){
        var back=e.target.closest('.pp-back');
        if(!back)return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if(location.hash.indexOf('#product=')===0){
          history.replaceState({},'',location.pathname+location.search);
          window.dispatchEvent(new PopStateEvent('popstate'));
        }else{window.location.assign('/')}
      },true);
    </script>
  </body>
</html>
